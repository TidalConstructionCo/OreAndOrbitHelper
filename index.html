<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crafting Tree</title>
  </head>

  <body>
    <button
      id="menu-toggle"
      class="menu-toggle"
      type="button"
      aria-controls="sidebar"
      aria-expanded="false"
    >
      ☰
      <span class="sr-only">Open navigation</span>
    </button>
    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>
    <div class="app-layout">
      <aside class="sidebar" id="sidebar">
        <button
          id="close-sidebar"
          class="close-sidebar"
          type="button"
          aria-label="Close navigation"
        >
          x
        </button>
        <h2>Ore & Orbit</h2>

        <button class="tool-button active" data-tool="crafting-tree">Crafting Tree</button>

        <button class="tool-button" data-tool="settings">Settings</button>

        <button id="reload-game-data" type="button">Reload Game Data</button>
      </aside>

      <!-- <div class="workspace">
            <div class="global-toolbar">
                
            </div>
        </div> -->

      <main class="content">
        <section id="crafting-tree" class="tool-panel active">
          <div class="tool-unavailable" hidden>
            <h1>Configuration required</h1>
            <p>
              Enter your API key in the Settings tab, click
              <strong>Save</strong>, then click <strong>Reload Game Data</strong>.
            </p>
          </div>
          <div class="tool-content">
            <h1>Crafting Tree</h1>
            <div class="controls">
              <label for="target-select">Target:</label>
              <select id="target-select"></select>

              <label for="tree-search">Search:</label>
              <input
                id="tree-search"
                type="search"
                placeholder="Search materials..."
                autocomplete="off"
              />
            </div>

            <div id="tree" class="tree"></div>

            <div class="extractor-settings">
              <h2>Material Abundance</h2>
            </div>
            <div class="sourced-materials">
              <!-- TODO -->
              <label for="sourced-material-select">Add sourced item:</label>
              <select id="sourced-material-select"></select>
              <button type="button" id="add-sourced-material">Add</button>
              <ul id="sourced-material-list"></ul>
            </div>
            <div id="summary" class="summary"></div>
          </div>
          <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
          <script type="module" src="./src/main-script.ts"></script>
        </section>

        <section id="settings" class="tool-panel">
          <h1>Settings</h1>
          <form id="apiKeyForm">
            <input
              id="apiKeyInput"
              type="password"
              placeholder="Enter your API key"
              autocomplete="off"
              required
            />
            <button type="submit">Save</button>
          </form>

          <div id="storedKey" hidden>
            <code id="keyValue"></code>
            <button id="removeKeyButton" type="button" hidden>Remove</button>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
