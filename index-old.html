<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crafting Tree</title>

    <style>
        :root {
            font-family: system-ui, sans-serif;
            color-scheme: light dark;
        }

        body {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px;
        }

        h1 {
            margin-top: 0;
        }

        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 24px;
        }

        select {
            padding: 6px 8px;
            font: inherit;
        }

        .tree {
            line-height: 1.7;
            font-family: ui-monospace, monospace;
        }

        .node {
            margin: 4px 0;
        }

        .node-content {
            display: inline-flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .children {
            margin-left: 28px;
            border-left: 1px solid #8886;
            padding-left: 14px;
        }

        .raw {
            color: #7cc576;
        }

        .cycle {
            color: #e57373;
        }

        .recipe-choice {
            font-family: system-ui, sans-serif;
            font-size: 0.9em;
            padding: 2px 5px;
        }

        .summary {
            margin-top: 28px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 18px;
        }

        .panel {
            border: 1px solid #8886;
            border-radius: 8px;
            padding: 14px;
        }

        .panel h2 {
            font-size: 1.1rem;
            margin-top: 0;
        }

        .panel ul {
            margin: 0;
            padding-left: 22px;
        }

        .muted {
            opacity: 0.7;
        }

        #node-search {
            width: 220px;
            padding: 6px 8px;
            font: inherit;
        }

        .node.match rect {
            fill: #a66b00;
            stroke: #ffd166;
            stroke-width: 4px;
        }

        .node.match text {
            fill: white;
        }

        .node.match {
            filter: drop-shadow(0 0 8px #ffd166);
        }
    </style>
</head>

<body>
    <h1>Crafting Tree</h1>

    <div class="controls">
        <label for="target-select">Target:</label>
        <select id="target-select"></select>

        <label for="node-search">Find:</label>
        <input id="node-search" type="search" placeholder="Search nodes..." autocomplete="off">
    </div>

    <div id="tree" class="tree"></div>

    <div id="summary" class="summary"></div>
    <script src="crafting-data.js"></script>
    <script>
        /*
         * Replace this example data with the contents of your data.py file.
         *
         * Every material has a unique name.
         * A material can have zero, one, or several crafting recipes.
         */

        const materials = GAME_DATA.materials;
        const recipes = GAME_DATA.recipes;
        const extractionRecipes = GAME_DATA.extractionRecipes;

        const recipeChoices = new Map();

        function formatAmount(amount) {
            if (Number.isInteger(amount)) {
                return String(amount);
            }

            return amount
                .toFixed(2)
                .replace(/0+$/, "")
                .replace(/\.$/, "");
        }

        function recipesProducing(material) {
            return recipes.filter(recipe =>
                recipe.outputs.some(output => output.material === material)
            );
        }

        function getSelectedRecipe(material) {
            const choices = recipesProducing(material);

            if (choices.length === 0) {
                return null;
            }

            const selectedIndex = recipeChoices.get(material) ?? 0;
            return choices[selectedIndex] ?? choices[0];
        }

        function getOutput(recipe, material) {
            return recipe.outputs.find(output => output.material === material);
        }

        function buildCraftingTree(targetMaterial) {
            const rawMaterials = {};
            const root = buildTreeNode(
                targetMaterial,
                null,
                new Set(),
                rawMaterials
            );

            const extractorRequirements = [];

            for (const [material, amount] of Object.entries(rawMaterials)) {
                const extraction = extractionRecipes[material];

                if (!extraction || !root.duration) {
                    continue;
                }

                const extractionCycles =
                    (amount * extraction.duration) /
                    (extraction.amount * root.duration);

                const extractors =
                    Math.ceil(extractionCycles * 1000) / 1000;

                extractorRequirements.push({
                    material,
                    amount,
                    extractors,
                    extractionCyclesPerExtractor: extractionCycles,
                    extractionDuration: extraction.duration
                });
            }

            return {
                root,
                rawMaterials,
                extractorRequirements
            };
        }

        function buildTreeNode(
            targetMaterial,
            requiredAmount,
            visited,
            rawMaterials
        ) {
            const recipe = getSelectedRecipe(targetMaterial);

            // No crafting recipe: this is a raw material.
            if (!recipe) {
                const amount = requiredAmount ?? 1;

                rawMaterials[targetMaterial] =
                    (rawMaterials[targetMaterial] ?? 0) + amount;

                return {
                    material: targetMaterial,
                    amount,
                    cycles: null,
                    duration: null,
                    children: [],
                    isRaw: true,
                    cycleDetected: false
                };
            }

            // Prevent recursive recipes from causing infinite recursion.
            if (visited.has(targetMaterial)) {
                return {
                    material: targetMaterial,
                    amount: requiredAmount ?? 0,
                    cycles: null,
                    duration: null,
                    children: [],
                    isRaw: false,
                    cycleDetected: true
                };
            }

            const output = getOutput(recipe, targetMaterial);

            let cycles;
            let amount;

            if (requiredAmount == null) {
                // The root represents one complete recipe cycle.
                cycles = 1;
                amount = output.amount;
            } else {
                amount = requiredAmount;
                cycles = requiredAmount / output.amount;
            }

            const node = {
                material: targetMaterial,
                amount,
                cycles,
                duration: recipe.duration * cycles,
                children: [],
                isRaw: false,
                cycleDetected: false
            };

            const nextVisited = new Set(visited);
            nextVisited.add(targetMaterial);

            for (const ingredient of recipe.inputs) {
                const childAmount = ingredient.amount * cycles;

                node.children.push(
                    buildTreeNode(
                        ingredient.material,
                        childAmount,
                        nextVisited,
                        rawMaterials
                    )
                );
            }

            return node;
        }

        function createRecipeSelector(material) {
            const choices = recipesProducing(material);

            if (choices.length <= 1) {
                return null;
            }

            const select = document.createElement("select");
            select.className = "recipe-choice";

            choices.forEach((recipe, index) => {
                const option = document.createElement("option");

                option.value = index;
                option.textContent =
                    `${recipe.name} — ${recipe.duration} minutes`;

                select.appendChild(option);
            });

            select.value = recipeChoices.get(material) ?? 0;

            select.addEventListener("change", event => {
                recipeChoices.set(material, Number(event.target.value));
                render();
            });

            return select;
        }

        function renderNode(node) {
            const wrapper = document.createElement("div");
            wrapper.className = "node";

            const content = document.createElement("div");
            content.className = "node-content";

            if (node.cycleDetected) {
                content.classList.add("cycle");
                content.textContent =
                    `${node.material} [cycle detected]`;
            } else if (node.isRaw) {
                content.classList.add("raw");
                content.textContent =
                    `${formatAmount(node.amount)}x ${node.material}`;
            } else {
                content.textContent =
                    `${formatAmount(node.amount)}x ${node.material} ` +
                    `(${formatAmount(node.cycles)} cycles, ` +
                    `${formatAmount(node.duration)} minutes)`;

                const recipeSelector = createRecipeSelector(node.material);

                if (recipeSelector) {
                    content.appendChild(recipeSelector);
                }
            }

            wrapper.appendChild(content);

            if (node.children.length > 0) {
                const children = document.createElement("div");
                children.className = "children";

                for (const child of node.children) {
                    children.appendChild(renderNode(child));
                }

                wrapper.appendChild(children);
            }

            return wrapper;
        }

        function renderSummary(tree) {
            const summary = document.getElementById("summary");
            summary.replaceChildren();

            const rawPanel = document.createElement("div");
            rawPanel.className = "panel";

            const rawTitle = document.createElement("h2");
            rawTitle.textContent = "Raw materials";
            rawPanel.appendChild(rawTitle);

            const rawList = document.createElement("ul");

            for (const [material, amount] of Object.entries(tree.rawMaterials)) {
                const item = document.createElement("li");
                item.textContent =
                    `${formatAmount(amount)}x ${material}`;
                rawList.appendChild(item);
            }

            if (rawList.children.length === 0) {
                const item = document.createElement("li");
                item.className = "muted";
                item.textContent = "None";
                rawList.appendChild(item);
            }

            rawPanel.appendChild(rawList);
            summary.appendChild(rawPanel);

            const extractorPanel = document.createElement("div");
            extractorPanel.className = "panel";

            const extractorTitle = document.createElement("h2");
            extractorTitle.textContent =
                `Extractors for one ${tree.root.material} cycle`;
            extractorPanel.appendChild(extractorTitle);

            const duration = document.createElement("p");
            duration.textContent =
                `${formatAmount(tree.root.duration ?? 0)} minutes`;
            extractorPanel.appendChild(duration);

            const extractorList = document.createElement("ul");

            for (const requirement of tree.extractorRequirements) {
                const item = document.createElement("li");
                item.textContent =
                    `${formatAmount(requirement.extractors)}x extractor ` +
                    `for ${requirement.material} ` +
                    `(${formatAmount(requirement.amount)} required)`;
                extractorList.appendChild(item);
            }

            if (extractorList.children.length === 0) {
                const item = document.createElement("li");
                item.className = "muted";
                item.textContent = "None";
                extractorList.appendChild(item);
            }

            extractorPanel.appendChild(extractorList);
            summary.appendChild(extractorPanel);
        }

        function render() {
            const target = document.getElementById("target-select").value;
            const treeElement = document.getElementById("tree");

            const tree = buildCraftingTree(target);

            treeElement.replaceChildren(renderNode(tree.root));
            renderSummary(tree);
        }

        function initialize() {
            const targetSelect = document.getElementById("target-select");

            for (const material of materials) {
                const option = document.createElement("option");
                option.value = material;
                option.textContent = material;
                targetSelect.appendChild(option);
            }

            targetSelect.value = "Extractor Kit";
            targetSelect.addEventListener("change", render);

            render();
        }

        initialize();
    </script>
</body>

</html>
